
{% extends "base.html" %}

{% block title %}Wickedbotz - Editar Usuário{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/editar_usuario.css') }}">
{% endblock %}

{% block content %}

<header class="content-header">
    <h2>Editar usuário</h2>
    <p>Altere os dados e as permissões do usuário.</p>
</header>

<section class="edit-user-container">

    <h3>Dados do usuário</h3>

    {% if erro %}
        <div class="edit-user-error">
            {{ erro }}
        </div>
    {% endif %}

    <form
        method="POST"
        action="{{ url_for('editar_usuario', id_usuario=usuario.id) }}"
        class="edit-user-form"
    >

        <label for="id">ID do usuário</label>

        <input
            type="text"
            id="id"
            value="{{ usuario.id }}"
            disabled
        >

        <label for="id_idface">ID iDFace</label>

        <input
            type="text"
            id="id_idface"
            value="{{ usuario.id_idface }}"
            disabled
        >

        <label for="nome">Nome completo</label>

        <input
            type="text"
            id="nome"
            name="nome"
            value="{{ usuario.nome }}"
            maxlength="100"
            required
        >

        <label for="categoria">Categoria</label>

        <select id="categoria" name="categoria" required>

            <option
                value="membro"
                {% if usuario.categoria == 'membro' %}selected{% endif %}
            >
                Membro
            </option>

            <option
                value="administrador"
                {% if usuario.categoria == 'administrador' %}selected{% endif %}
            >
                Administrador
            </option>

        </select>

        <div class="edit-user-actions">

            <button type="submit" class="btn-primary">
                Salvar alterações
            </button>

            <a href="{{ url_for('usuarios') }}" class="btn-secondary">
                Cancelar
            </a>

        </div>

    </form>

</section>

{% endblock %}
