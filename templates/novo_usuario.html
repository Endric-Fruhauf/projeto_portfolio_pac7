
{% extends "base.html" %}

{% block title %}Wickedbotz - Novo Usuário{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/novo_usuario.css') }}">
{% endblock %}

{% block content %}

<header class="content-header">
    <h2>Novo usuário</h2>
    <p>Preencha os dados para cadastrar um novo usuário.</p>
</header>

<section class="new-user-container">

    <h3>Dados do usuário</h3>

    {% if erro %}
        <div class="new-user-error">
            {{ erro }}
        </div>
    {% endif %}

    <form
        method="POST"
        action="{{ url_for('novo_usuario') }}"
        class="new-user-form"
    >

        <label for="nome">Nome completo</label>

        <input
            type="text"
            id="nome"
            name="nome"
            placeholder="Digite o nome completo"
            value="{{ nome or '' }}"
            maxlength="100"
            required
        >

        <label for="categoria">Categoria</label>

        <select id="categoria" name="categoria" required>

            <option value="membro"
                {% if categoria == 'membro' or not categoria %}
                    selected
                {% endif %}
            >
                Membro
            </option>

            <option value="administrador"
                {% if categoria == 'administrador' %}
                    selected
                {% endif %}
            >
                Administrador
            </option>

        </select>

        <div class="new-user-actions">

            <button type="submit" class="btn-primary">
                Cadastrar usuário
            </button>

            <a href="{{ url_for('usuarios') }}" class="btn-secondary">
                Cancelar
            </a>

        </div>

    </form>

</section>

{% endblock %}
