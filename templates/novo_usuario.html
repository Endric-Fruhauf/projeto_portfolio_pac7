
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wickedbotz - Novo Usuário</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/painel.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/novo_usuario.css') }}">
</head>

<body>

    <div class="dashboard-container">

        <!-- MENU LATERAL -->
        <aside class="sidebar">

            <div class="sidebar-header">
                <h1>Wickedbotz</h1>
                <p>Painel Administrativo</p>
            </div>

            <nav class="sidebar-menu">

                <a href="{{ url_for('painel') }}" class="menu-item">
                    Início
                </a>

                <a href="{{ url_for('usuarios') }}" class="menu-item active">
                    Usuários
                </a>

                <a href="#" class="menu-item">
                    Registros de acesso
                </a>

                <a href="#" class="menu-item">
                    Administradores
                </a>

            </nav>

            <div class="sidebar-footer">
                <span>Olá, {{ session['admin_nome'] }}</span>
                <a href="{{ url_for('logout') }}">Sair</a>
            </div>

        </aside>


        <!-- CONTEUDO PRINCIPAL -->
        <main class="main-content">

            <header class="content-header">
                <h2>Novo usuário</h2>
                <p>Preencha os dados para cadastrar um novo usuário.</p>
            </header>


            <section class="new-user-container">

                <h3>Dados do usuário</h3>

                {% if erro %}
                    <div class="new-user-error">
                        {{ erro }}
                    </div>
                {% endif %}

                <form
                    method="POST"
                    action="{{ url_for('novo_usuario') }}"
                    class="new-user-form"
                >

                    <!-- NOME -->
                    <label for="nome">Nome completo</label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite o nome completo"
                        value="{{ nome or '' }}"
                        maxlength="100"
                        required
                    >


                    <!-- CATEGORIA -->
                    <label for="categoria">Categoria</label>

                    <select
                        id="categoria"
                        name="categoria"
                        required
                    >

                        <option value="membro"
                            {% if categoria == 'membro' or not categoria %}
                                selected
                            {% endif %}
                        >
                            Membro
                        </option>

                        <option value="administrador"
                            {% if categoria == 'administrador' %}
                                selected
                            {% endif %}
                        >
                            Administrador
                        </option>

                    </select>


                    <!-- BOTOES -->
                    <div class="new-user-actions">

                        <button type="submit" class="btn-primary">
                            Cadastrar usuário
                        </button>

                        <a
                            href="{{ url_for('usuarios') }}"
                            class="btn-secondary"
                        >
                            Cancelar
                        </a>

                    </div>

                </form>

            </section>

        </main>

    </div>

</body>
</html>
